schema_version: ods.services.v1

compatibility:
  ods_min: "2.0.0"

service:
  id: embeddings
  name: TEI (Embeddings)
  aliases: [embed]
  container_name: ods-embeddings
  host_env: EMBEDDINGS_HOST
  default_host: embeddings
  port: 80
  external_port_env: EMBEDDINGS_PORT
  external_port_default: 8090
  health: /health
  ui_path: /info
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []

# ODS Desktop (Windows, no Docker and no WSL) serves the same model, BAAI
# bge-base-en-v1.5, with its own pinned llama.cpp llama-server in embedding mode
# (OpenAI-compatible /v1/embeddings) instead of the TEI container. The GGUF is
# the q8_0 build from CompendiumLabs (MIT), pinned to a repository commit; size
# and SHA-256 come from the Hugging Face API and were rechecked after download.
# It runs on the CPU (--device none) so it never competes with the chat model
# for GPU memory.
native:
  windows:
    version: "1.5"
    runtime: llama-server
    model:
      url: https://huggingface.co/CompendiumLabs/bge-base-en-v1.5-gguf/resolve/24914efdfa9ee54e815c3fcaa78a617031251c5c/bge-base-en-v1.5-q8_0.gguf
      size: 117974304
      sha256: ad1afe72cd6654a558667a3db10878b049a75bfd72912e1dabb91310d671173c
    args: ["-m", "{model}", "--embedding", "--pooling", "cls", "--device", "none", "--ctx-size", "512", "--batch-size", "512", "--ubatch-size", "512",
           "--host", "127.0.0.1", "--port", "{port}", "--api-key-file", "{keyfile}", "--no-webui"]
    port: 8090
    health: /health
